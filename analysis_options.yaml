include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    # Cascades on a game object in a test hide which call is being asserted on.
    cascade_invocations: false
    # Writing the class name in its own constructor reads better than `new(`,
    # especially for anyone coming to Dart from Java or Kotlin.
    unnecessary_type_name_in_constructor: false
    # This is an app, not a package. Documenting every public member would mean
    # a docstring on every widget, which says nothing the name does not.
    public_member_api_docs: false
